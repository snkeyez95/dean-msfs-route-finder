<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none;}
  /* Always-visible dot, top-right. Amber = live; grey = live mode on but sim not connected yet. */
  #dot{ position:fixed; top:14px; right:14px; width:15px; height:15px; border-radius:50%;
        background:#f5a623; box-shadow:0 0 0 3px rgba(245,166,35,0.18), 0 2px 8px rgba(0,0,0,0.55); cursor:pointer; }
  #dot.off{ background:#5a5d64; box-shadow:0 0 0 3px rgba(90,93,100,0.15), 0 2px 8px rgba(0,0,0,0.55); }
  #dot.pulse{ animation:pulse 1.25s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 3px rgba(245,166,35,0.20),0 2px 8px rgba(0,0,0,0.55);} 50%{ box-shadow:0 0 0 8px rgba(245,166,35,0.34),0 2px 8px rgba(0,0,0,0.55);} }
  /* Expandable panel under the dot. */
  #panel{ position:fixed; top:38px; right:14px; width:300px; background:rgba(18,20,24,0.95);
          border:1px solid rgba(245,166,35,0.45); border-radius:12px; padding:12px 14px; color:#e8e8ea;
          box-shadow:0 8px 30px rgba(0,0,0,0.62); opacity:0; transform:translateY(-6px); pointer-events:none;
          transition:opacity .2s ease, transform .2s ease; }
  #panel.show{ opacity:1; transform:translateY(0); }
  .st{ font-size:12px; color:#46c46a; margin-bottom:8px; display:none; }
  .atis{ font-size:12px; color:#d0a93a; margin-bottom:9px; display:none; font-variant-numeric:tabular-nums; }
  .k{ font-size:9px; text-transform:uppercase; letter-spacing:.09em; color:#7a7d84; margin-bottom:3px; }
  .freq{ font-size:27px; font-weight:800; color:#f5a623; font-variant-numeric:tabular-nums; letter-spacing:-.01em; line-height:1.05; font-family:'JetBrains Mono','Consolas',monospace; }
  .who{ font-size:13px; font-weight:600; color:#e8e8ea; margin-top:2px; }
  .why{ font-size:11px; color:#9a9da3; margin-top:5px; line-height:1.4; }
  .next{ font-size:11.5px; color:#b9bbc0; margin-top:8px; font-variant-numeric:tabular-nums; display:none; }
  .also{ font-size:10.5px; color:#7a7d84; margin-top:5px; font-variant-numeric:tabular-nums; display:none; }
  .cur{ font-size:10.5px; color:#7a7d84; margin-top:5px; font-variant-numeric:tabular-nums; display:none; }
  /* v6.12.0: minimal live perf strip (RTSS-style) — one mono line, only while a capture is recording. */
  .perf{ font-size:10px; color:#9a9da3; margin-top:8px; padding-top:7px; border-top:1px solid rgba(122,125,132,0.25);
         font-family:'JetBrains Mono','Consolas',monospace; font-variant-numeric:tabular-nums; white-space:nowrap; display:none; }
</style></head><body>
<div id="dot" class="off" title="VATSIM frequency helper — click to expand"></div>
<div id="panel">
  <div class="st" id="st"></div>
  <div class="atis" id="atis"></div>
  <div class="k" id="klabel">Frequency to be on</div>
  <div class="freq" id="freq">&mdash;</div>
  <div class="who" id="who"></div>
  <div class="why" id="why"></div>
  <div class="next" id="next"></div>
  <div class="also" id="also"></div>
  <div class="cur" id="cur"></div>
  <div class="perf" id="perf"></div>
</div>
<script>
  const dot=document.getElementById('dot'), panel=document.getElementById('panel');
  const st=document.getElementById('st'), atis=document.getElementById('atis'), freq=document.getElementById('freq'),
        who=document.getElementById('who'), why=document.getElementById('why'), nxt=document.getElementById('next'), also=document.getElementById('also'), cur=document.getElementById('cur'),
        klabel=document.getElementById('klabel'), perfEl=document.getElementById('perf');
  // v6.12.0: compact live perf line — fields simply skipped when null (offline / no data yet).
  function perfLine(q){
    if(!q) return '';
    const parts=[];
    if(q.ft_avg!=null) parts.push(q.ft_avg.toFixed(1)+'ms'+(q.ft_p99!=null?(' · p99 '+q.ft_p99.toFixed(1)):''));
    if(q.cpu_busy_avg!=null||q.gpu_busy_avg!=null) parts.push('CPU '+(q.cpu_busy_avg!=null?q.cpu_busy_avg.toFixed(1):'—')+' / GPU '+(q.gpu_busy_avg!=null?q.gpu_busy_avg.toFixed(1):'—')+'ms');
    const gv=[]; if(q.gpu_util_pct!=null)gv.push('GPU '+q.gpu_util_pct+'%'); if(q.vram_pct!=null)gv.push('VRAM '+q.vram_pct+'%');
    if(gv.length) parts.push(gv.join(' · '));
    if(q.tlod!=null) parts.push('TLOD '+q.tlod);
    return parts.join('  |  ');
  }
  let expanded=false, collapseTimer=null, statusTimer=null, curIgnore=true;

  // Aviation cabin "bong" — the seatbelt-sign chime (hi note then lo note). ONE persistent AudioContext,
  // resumed each call: a fresh context per beep in a click-through window that never gets a user gesture
  // can be born "suspended" and stay silent (Dean 2026-07-13: chime lagged/missed). resume() + a single
  // reused context (main.js also sets autoplayPolicy:'no-user-gesture-required') makes it reliable.
  let _actx=null;
  function beep(){ try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    const c=_actx; if(c.state==='suspended'){ try{ c.resume(); }catch(e){} }
    function tone(f,t0,dur){ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,c.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.09,c.currentTime+t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+dur);
      o.connect(g); g.connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.03); }
    tone(1046.5,0,0.5); tone(830.6,0.26,0.62);   // C6 → G#5
  }catch(e){} }

  function expand(){ expanded=true; panel.classList.add('show'); dot.classList.remove('pulse'); }
  function collapse(){ expanded=false; panel.classList.remove('show'); }
  // Auto-open the panel for `ms`, then collapse to the dot and pulse it so a missed alert is still visible.
  function autoExpand(ms){ expand(); clearTimeout(collapseTimer); collapseTimer=setTimeout(function(){ collapse(); dot.classList.add('pulse'); }, ms||20000); }

  // Click = toggle panel. Click-HOLD-drag = move the whole overlay anywhere on screen (v6.11.6 —
  // the default top-right spot sat on the PMDG overhead light switches). Pointer capture keeps the
  // drag alive even when the window lags behind the cursor; <5px of travel still counts as a click.
  let dragPid=null, dragLast=null, dragDist=0, draggingNow=false;
  dot.addEventListener('pointerdown', function(e){
    if(e.button!==0) return;
    dragPid=e.pointerId; dragLast={x:e.screenX,y:e.screenY}; dragDist=0; draggingNow=false;
    try{ dot.setPointerCapture(e.pointerId); }catch(err){}
  });
  dot.addEventListener('pointermove', function(e){
    if(dragPid===null || e.pointerId!==dragPid) return;
    const dx=e.screenX-dragLast.x, dy=e.screenY-dragLast.y;
    if(!dx && !dy) return;
    dragDist+=Math.abs(dx)+Math.abs(dy);
    if(dragDist>5){
      draggingNow=true; setIgnore(false);
      dragLast={x:e.screenX,y:e.screenY};
      try{ window.api.overlayMove({dx:dx, dy:dy}); }catch(err){}
    }
  });
  function endDrag(e){
    if(dragPid===null || (e.pointerId!==undefined && e.pointerId!==dragPid)) return;
    const wasDrag=draggingNow; dragPid=null; draggingNow=false;
    try{ dot.releasePointerCapture(e.pointerId); }catch(err){}
    if(wasDrag){ try{ window.api.overlayMove({save:true}); }catch(err){} }
    else { clearTimeout(collapseTimer); if(expanded){ collapse(); } else { expand(); dot.classList.remove('pulse'); } }
  }
  dot.addEventListener('pointerup', endDrag);
  dot.addEventListener('pointercancel', endDrag);

  // Live recommendation state — pushed every ~5s from the app. Fields are pre-formatted strings.
  if(window.api&&window.api.onOverlayState) window.api.onOverlayState(function(p){
    p=p||{};
    if(!p.live){ dot.className='off'; freq.innerHTML='&mdash;'; who.textContent=''; why.textContent='';
      atis.style.display='none'; nxt.style.display='none'; also.style.display='none'; cur.style.display='none'; perfEl.style.display='none'; return; }
    dot.classList.remove('off');   // live — keep any pulse
    freq.textContent=p.freq||'—'; who.textContent=p.who||''; why.textContent=p.why||'';
    atis.textContent=p.atis||''; atis.style.display=p.atis?'block':'none';
    nxt.textContent=p.next||''; nxt.style.display=p.next?'block':'none';
    also.textContent=p.also||''; also.style.display=p.also?'block':'none';
    const pl=perfLine(p.perf); perfEl.textContent=pl; perfEl.style.display=pl?'block':'none';
    // On-frequency: the header confirms ("ON FREQUENCY ✓" green + green number) and the redundant
    // "you're tuned to X" line is dropped. Otherwise it instructs ("Frequency to be on") and shows
    // what you're currently on so the gap is obvious.
    if(p.onFreq){ klabel.textContent='On frequency ✓'; klabel.style.color='#46c46a'; freq.style.color='#46c46a';
      cur.style.display='none'; }
    else{ klabel.textContent='Frequency to be on'; klabel.style.color=''; freq.style.color='';
      cur.textContent=p.cur||''; cur.style.display=p.cur?'block':'none'; }
    // New recommended frequency: pop open (+chime) if enabled, else just pulse the dot to flag it.
    if(p.isNewRec){ if(p.pop!==false){ autoExpand(20000); if(p.sound) beep(); } else { dot.classList.add('pulse'); } }
  });

  // Status blips unrelated to frequency (performance-logging started, connection lost) — shown briefly at
  // the top of the panel, reusing the same expand + chime.
  if(window.api&&window.api.onOverlayToast) window.api.onOverlayToast(function(p){
    p=p||{};
    st.textContent=(p.title||'')+(p.sub?' — '+p.sub:''); st.style.color=(p.type==='connectionLost'?'#e0823c':'#46c46a'); st.style.display='block';
    autoExpand(p.ms||14000); if(p.sound)beep();
    clearTimeout(statusTimer); statusTimer=setTimeout(function(){ st.style.display='none'; }, (p.ms||14000));
  });

  // Interactivity: only the dot (and the panel while open) catches the mouse; everything else is
  // click-through to the sim. mousemove is forwarded even while click-through, so we hit-test + toggle.
  function inRect(x,y,el){ const r=el.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }
  function setIgnore(ig){ if(ig===curIgnore)return; curIgnore=ig; try{ window.api.overlaySetIgnore({ignore:ig}); }catch(e){} }
  document.addEventListener('mousemove', function(e){
    if(draggingNow) return;   // mid-drag the window lags the cursor — never flip click-through back on
    const overDot = inRect(e.clientX,e.clientY,dot);
    const overPanel = panel.classList.contains('show') && inRect(e.clientX,e.clientY,panel);
    setIgnore(!(overDot||overPanel));
  });
</script></body></html>
